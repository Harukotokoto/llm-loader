[package]
name = "llm"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15.7"
encoding_rs = "0.8"
hf-hub = "1"
llama-cpp-2 = { version = "0.1", features = ["sampler", "vulkan"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
